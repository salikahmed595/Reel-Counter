org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Reel Counter release configuration (override in ~/.gradle/gradle.properties or with -P) ---
# Bump versionCode for every Play upload.
reelcounter.versionCode=2
reelcounter.versionName=1.1.0
# HTTPS URL of the deployed billing backend (see ../reel-counter-billing-backend). Empty = Pro stays locked.
reelcounter.billingBackendUrl=
# Public HTTPS URL where docs/privacy-policy.html is hosted. REQUIRED before submitting to Play.
reelcounter.privacyPolicyUrl=
# Support email shown in-app and on the store listing.
reelcounter.supportEmail=
